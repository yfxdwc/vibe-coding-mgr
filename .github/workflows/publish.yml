name: npm publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      id-token: write     # for npm provenance
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Node deps
        run: npm ci || npm install

      - name: Setup Python venv + install server deps
        # v0.18.4 fix-up: tests/install-launchd.sh, tests/daemon.test.js
        # and scripts/install-service.sh expect .venv/bin/python3 to
        # exist. Without this step they fail with '$VENV_PY not found'
        # on the npm test run.
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip wheel setuptools
          .venv/bin/python -m pip install -r server/requirements.txt

      - name: Run tests
        run: npm test

      - name: Bump package.json version to tag (idempotent)
        run: |
          TAG="${GITHUB_REF_NAME}"   # e.g. v0.4.0
          TARGET="${TAG#v}"          # strip 'v'
          if [ -z "$TARGET" ]; then
            echo "no tag version, skipping"
            exit 0
          fi
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" = "$TARGET" ]; then
            echo "package.json already at $TARGET"
            exit 0
          fi
          echo "Bumping $CURRENT → $TARGET"
          # Use node to update (sed in-place is unsafe for JSON).
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            pkg.version = '$TARGET';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Commit the version bump (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet package.json; then
            echo "no version diff, nothing to commit"
          else
            git add package.json
            git commit -m "chore(vcm): bump version to \${GITHUB_REF_NAME}"
          fi

      - name: Publish to npm (with provenance)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
