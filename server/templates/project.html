<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>vcm-server: {{ project_name }}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #1f2937; }
    h1 { border-bottom: 2px solid #e5e7eb; padding-bottom: 0.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
    .card { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem; }
    .card .label { font-size: 0.875rem; color: #6b7280; text-transform: uppercase; }
    .card .value { font-size: 1.5rem; font-weight: 600; margin-top: 0.5rem; }
    pre { background: #1f2937; color: #f9fafb; padding: 1rem; border-radius: 8px; overflow-x: auto; font-size: 0.875rem; }
    a { color: #4f46e5; }
  </style>
</head>
<body>
  <h1>📦 {{ project_name }}</h1>
  <p><a href="/">← back to dashboard</a></p>

  <div id="content">
    <p>Loading…</p>
  </div>

  <script>
    async function load() {
      const resp = await fetch('/api/projects/{{ project_name }}');
      if (!resp.ok) {
        document.getElementById('content').innerHTML = '<p>Project not found.</p>';
        return;
      }
      const data = await resp.json();
      const state = data.state || {};
      const g = state.governance || {};
      const git = state.git || {};

      document.getElementById('content').innerHTML = `
        <h2>Path</h2>
        <pre>${data.path || 'unknown'}</pre>

        <h2>Governance</h2>
        <div class="grid">
          <div class="card">
            <div class="label">AGENTS.md</div>
            <div class="value">${g.agents_md_present ? '✓' : '✗'}</div>
          </div>
          <div class="card">
            <div class="label">CHARTER.md</div>
            <div class="value">${g.charter_md_present ? '✓' : '✗'}</div>
          </div>
          <div class="card">
            <div class="label">Skills</div>
            <div class="value">${g.skills_count ?? '—'}</div>
          </div>
          <div class="card">
            <div class="label">ADRs</div>
            <div class="value">${g.adrs_count ?? '—'}</div>
          </div>
          <div class="card">
            <div class="label">TDs</div>
            <div class="value">${g.tds_count ?? '—'}</div>
          </div>
          <div class="card">
            <div class="label">Post-mortems</div>
            <div class="value">${g.post_mortems_count ?? '—'}</div>
          </div>
        </div>

        <h2>Git</h2>
        <div class="grid">
          <div class="card">
            <div class="label">Branch</div>
            <div class="value">${git.branch || '—'}</div>
          </div>
          <div class="card">
            <div class="label">HEAD</div>
            <div class="value" style="font-family: monospace; font-size: 0.875rem;">${(git.head_commit || '').slice(0, 7) || '—'}</div>
          </div>
          <div class="card">
            <div class="label">Working tree</div>
            <div class="value">${git.dirty ? '⚠ dirty' : '✓ clean'}</div>
          </div>
        </div>

        ${g.skills_registered && g.skills_registered.length ? `
          <h2>Registered Skills</h2>
          <p>${g.skills_registered.map(s => `<code>${s}</code>`).join(' ')}</p>
        ` : ''}

        <h2>First seen / Last seen</h2>
        <p>First: <code>${data.first_seen_at || '—'}</code><br>Last: <code>${data.last_seen_at || '—'}</code></p>
      `;
    }
    load();
  </script>
</body>
</html>
