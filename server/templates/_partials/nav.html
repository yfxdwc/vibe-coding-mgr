{# server/templates/_partials/nav.html — 顶部导航 (DESIGN.md §5)
   - 来自 _layout.html 自动 include
   - 高亮由 page.nav_active 决定，可被各 page 覆写
   - auth_required 由 app.py 注入
#}
<nav class="nav" x-data="{ active: '{{ nav_active or 'cockpit' }}' }">
  <a class="nav-brand" href="/">
    <span class="nav-mark">vcm</span>
    <span>vibe coding mgr</span>
  </a>

  <div class="nav-links">
    <a class="nav-link" :class="{ active: active === 'cockpit' }" href="/">cockpit</a>
    <a class="nav-link" :class="{ active: active === 'leaderboard' }" href="/leaderboard">leaderboard</a>
    <a class="nav-link" :class="{ active: active === 'skills' }" href="/skills">skills</a>
    <a class="nav-link" :class="{ active: active === 'trends' }" href="/trends">trends</a>
    <a class="nav-link" :class="{ active: active === 'peers' }" href="/peers">peers</a>
    <a class="nav-link" :class="{ active: active === 'audit' }" href="/audit">audit</a>
    <a class="nav-link" :class="{ active: active === 'docs' }" href="/docs/DESIGN.md">docs</a>
    <a class="nav-link" :class="{ active: active === 'settings' }" href="/settings">settings</a>
  </div>

  <div class="nav-meta">
    <span><b x-text="summary.total_projects || 0"></b> projects</span>
    <span>·</span>
    <span><b x-text="summary.total_skills || 0"></b> skills</span>
    <span>·</span>
    <span><b x-text="summary.total_adrs || 0"></b> adrs</span>
    <span>·</span>
    <span class="badge" :class="
      summary.needs_attention > 0 ? 'badge--warn' :
      summary.warning     > 0 ? 'badge--warn' :
      (summary.healthy > 0 ? 'badge--ok' : 'badge--idle')
    ">
      <span x-text="summary.health_label || '—'"></span>
    </span>
    <span class="badge badge--idle" x-show="{{ 'true' if auth_required else 'false' }}" title="API requires HTTP Basic Auth (ADR-0004)">🔒</span>
    <button class="btn btn--sm btn--ghost" @click="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">☀/☾</button>
  </div>
</nav>
